name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lean smoke env: the core metric (src/nec.py) needs only these.
      # Full reproduction uses the pinned uv.lock (torch/transformers/datasets).
      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn scipy pytest

      - name: Verify committed payload integrity
        run: shasum -a 256 -c manifest.sha256

      - name: Smoke + determinism test
        run: pytest -q
